// Implemented by the Claim Intake service, which owns the claim and its status.
// Callers: Approval (UpdateStatus), Eligibility and Assessment (GetClaim, Record*).
syntax = "proto3";

package claims.claim.v1;

option java_multiple_files = true;
option java_package = "com.claims.proto.claim.v1";
option java_outer_classname = "ClaimProto";

service ClaimService {
  // Moves the claim to `status`. Idempotent: if the claim already has that status it returns OK
  // without a change. NOT_FOUND for an unknown claim, FAILED_PRECONDITION for a disallowed transition.
  rpc UpdateStatus(UpdateStatusRequest) returns (UpdateStatusReply);

  // The claim as other services need it. NOT_FOUND for an unknown claim.
  rpc GetClaim(GetClaimRequest) returns (ClaimDetails);

  // Stores an eligibility result (automatic, or an adjuster override from the Eligibility service).
  // Does not change the status.
  rpc RecordEligibility(RecordEligibilityRequest) returns (RecordReply);

  // Stores the proposed (payable) amount (automatic, or an adjuster adjustment from Assessment).
  // Does not change the status.
  rpc RecordAssessment(RecordAssessmentRequest) returns (RecordReply);
}

// Same values as CLAIM_STATUS in frontend/src/lib/status.js.
enum ClaimStatus {
  CLAIM_STATUS_UNSPECIFIED = 0;
  SUBMITTED = 1;
  DOCS_PENDING = 2;
  DOCS_VERIFIED = 3;
  ELIGIBILITY_CHECKED = 4;
  ASSESSED = 5;
  UNDER_REVIEW = 6;
  APPROVED = 7;
  REJECTED = 8;
  SETTLING = 9;
  SETTLED = 10;
  SETTLEMENT_FAILED = 11;
}

message Actor {
  string id = 1;
  string role = 2;       // ADJUSTER, POLICYHOLDER or SYSTEM
  string name = 3;
}

message UpdateStatusRequest {
  string claim_id = 1;        // UUID
  ClaimStatus status = 2;
  string reason = 3;          // e.g. the adjuster's comment, or why settlement failed
  Actor actor = 4;
  string idempotency_key = 5; // e.g. "<txId>:SETTLEMENT_FAILED"
}

message UpdateStatusReply {
  ClaimStatus previous_status = 1;
  ClaimStatus status = 2;
  bool changed = 3;           // false when the claim already had this status
}

message GetClaimRequest {
  string claim_id = 1;
}

// Everything Eligibility and Assessment need to evaluate a claim.
message ClaimDetails {
  string claim_id = 1;
  string claim_no = 2;
  string policy_no = 3;
  string member_id = 4;
  string policyholder_id = 5;
  string hospital_name = 6;
  string admission_date = 7;      // ISO yyyy-MM-dd
  string discharge_date = 8;
  string diagnosis = 9;
  string treatment_category = 10;
  string claimed_amount = 11;     // decimal as text
  string proposed_amount = 12;    // empty until assessed
  string approved_amount = 13;    // empty until settled
  ClaimStatus status = 14;
  string currency = 15;
  string submitted_by = 16;       // login user id of the policyholder who filed it (Payment finds the payee by it)
  EligibilityRecord latest_eligibility = 17;  // set by GetClaim only; absent until eligibility is recorded
}

// The latest eligibility result Claim Intake recorded: the automatic check or an adjuster's override.
message EligibilityRecord {
  bool eligible = 1;
  bool overridden = 2;
  string override_reason = 3;
  string override_comment = 4;
  string checked_by = 5;          // "ROLE:Name", e.g. "ADJUSTER:Rohan Mehta" or "SYSTEM:claim-intake"
  string checked_at = 6;          // ISO-8601 instant
}

message RuleResult {
  string rule = 1;     // e.g. POLICY_ACTIVE, WAITING_PERIOD
  string label = 2;    // human-readable
  bool passed = 3;
  string detail = 4;
}

message RecordEligibilityRequest {
  string claim_id = 1;
  bool eligible = 2;
  repeated RuleResult rules = 3;
  bool overridden = 4;
  string override_comment = 5;
  Actor actor = 6;
  string override_reason = 7;     // with overridden = true, e.g. "Documents reviewed manually"
}

message RecordAssessmentRequest {
  string claim_id = 1;
  string proposed_amount = 2;     // decimal as text
  string comment = 3;
  Actor actor = 4;
}

message RecordReply {
  ClaimStatus status = 1;
}
