spring:
  application:
    name: gateway-simulator

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  # Upper bound for SLOW, so a typo cannot hang a request for hours.
  max-delay-ms: 60000
