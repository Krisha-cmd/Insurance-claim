# Every setting can be overridden with an environment variable. On EKS the
# values come from the `login-db` Secret, the `jwt-keys` Secret and the
# `platform-endpoints` ConfigMap; locally the defaults below match docker-compose.yml.

spring:
  application:
    name: login
  profiles:
    default: local

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/login}
    username: ${SPRING_DATASOURCE_USERNAME:login}
    password: ${SPRING_DATASOURCE_PASSWORD:login}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

app:
  jwt:
    issuer: claims-login
    ttl: 60m
    # PEM text. PKCS#8 private key ("BEGIN PRIVATE KEY") and X.509 public key ("BEGIN PUBLIC KEY").
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    # Only the `local` profile may fall back to a throw-away key pair.
    generate-if-missing: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  lockout:
    max-failures: 5
    window: 15m

---
spring:
  config:
    activate:
      on-profile: local

app:
  jwt:
    generate-if-missing: true

---
spring:
  config:
    activate:
      on-profile: aws

server:
  # Trust X-Forwarded-For from the ALB (private VPC addresses) so login_attempts records the client IP.
  forward-headers-strategy: native
