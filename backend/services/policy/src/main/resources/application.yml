# On EKS: `policy-db` Secret (SPRING_DATASOURCE_*), `platform-endpoints` ConfigMap (KAFKA_BOOTSTRAP) and the
# Deployment (GRPC_CLAIM_TARGET, JWT_JWKS_URI).

spring:
  application:
    name: policy
  profiles:
    default: local

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/policy}
    username: ${SPRING_DATASOURCE_USERNAME:policy}
    password: ${SPRING_DATASOURCE_PASSWORD:policy}
    hikari:
      maximum-pool-size: 15

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: always

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8080/.well-known/jwks.json}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 5000
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
        linger.ms: 5

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets, so Grafana can compute p50/p95/p99 across pods (histogram_quantile).
      percentiles-histogram:
        http.server.requests: true
        grpc.server.processing.duration: true

claims:
  jwt:
    issuer: claims-login

  events:
    topic: claim-events
    kafka-bootstrap: ${KAFKA_BOOTSTRAP:}

  grpc:
    server:
      port: ${GRPC_PORT:9090}
      in-process-name: ""
    # Claim Intake's ClaimService: CanCommit only carries the claim id, so prepare looks up its policy there.
    claim-target: ${GRPC_CLAIM_TARGET:dns:///claim-intake:9090}

  policy:
    currency: INR
    claim-lookup-timeout: 3s
    participant:
      prepare-timeout: 5m
      precommit-timeout: 2m
      sweep-interval: PT15S

---
spring:
  config:
    activate:
      on-profile: aws

server:
  forward-headers-strategy: native
