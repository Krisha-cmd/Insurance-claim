# The Argo CD project for the claims system: which repository Argo CD may read and where it may deploy.
# Terraform (infra/terraform/platform/argocd-root-app.tf) creates this same object from this file.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: claims
  namespace: argocd
spec:
  description: Medical insurance claims system
  sourceRepos:
    - https://github.com/Krisha-cmd/Insurance-claim.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: claims       # the services
    - server: https://kubernetes.default.svc
      namespace: argocd       # the child Applications of the root app
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace         # k8s/base/namespace.yaml (never pruned)
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
