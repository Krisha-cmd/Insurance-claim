# The root "app of apps": it watches gitops/apps/ and creates the Application of this cluster's environment.
# Terraform (infra/terraform/platform/argocd-root-app.tf) creates this same object from this file, setting
# repoURL / targetRevision from its variables and `include` to "<env>.yaml" from var.env. To bootstrap
# without Terraform, see gitops/README.md (and change `include` to prod.yaml on the prod cluster).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: claims-root
  namespace: argocd
spec:
  project: claims
  source:
    repoURL: https://github.com/Krisha-cmd/Insurance-claim.git
    targetRevision: main
    path: gitops/apps
    directory:
      recurse: false
      include: dev.yaml       # one environment per cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
