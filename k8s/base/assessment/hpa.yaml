apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: assessment
  labels:
    app.kubernetes.io/name: assessment
    app.kubernetes.io/part-of: claims
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: assessment
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
