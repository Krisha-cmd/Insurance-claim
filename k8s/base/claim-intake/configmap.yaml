# Non-secret settings for claim-intake. Shared AWS endpoints (KAFKA_BOOTSTRAP, DOCUMENTS_BUCKET,
# RESULTS_QUEUE_URL, ANALYTICS_TABLE, AWS_REGION) come from the platform-endpoints ConfigMap,
# which the Terraform platform stack creates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claim-intake-config
  labels:
    app.kubernetes.io/name: claim-intake
    app.kubernetes.io/part-of: claims
data:
  SPRING_PROFILES_ACTIVE: "aws"
  JWT_JWKS_URI: "http://login.claims.svc.cluster.local/.well-known/jwks.json"
  GRPC_PORT: "9090"
  GRPC_POLICY_TARGET: "dns:///policy:9090"
  GRPC_ELIGIBILITY_TARGET: "dns:///eligibility:9090"
  GRPC_ASSESSMENT_TARGET: "dns:///assessment:9090"
  # Document types that must each have a VERIFIED document before a claim moves to DOCS_VERIFIED and the
  # eligibility and assessment checks start. Must match the "required" flags in frontend/src/lib/status.js,
  # where prescriptions and lab reports are optional. (The application.yml default also lists PRESCRIPTION.)
  REQUIRED_DOC_TYPES: "DISCHARGE_SUMMARY,FINAL_BILL,ID_PROOF"
  # Connection pool per pod. All services share one small RDS instance (~80 connections), and every
  # replica opens its own pool, so it is kept small enough for every service at its HPA maximum (capacity.md).
  SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "1"
