# Login: credentials, lockout, RS256 JWTs, JWKS
# Secrets (database credentials, JWT keys) and platform-endpoints are created by the Terraform platform
# stack in the claims namespace; this file only references them by name, so no secret is in Git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: login
  labels:
    app.kubernetes.io/name: login
    app.kubernetes.io/part-of: claims
spec:
  replicas: 1  # overlays set the count; the HPA scales from there
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: login
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: login
        app.kubernetes.io/part-of: claims
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:  # spread replicas over nodes when possible
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: login }
      containers:
        - name: login
          image: login  # each overlay's `images:` sets the ECR repository and tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-endpoints
            - configMapRef:
                name: login-config
            - secretRef:
                name: login-db
          env:
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: jwt-keys, key: private.pem }
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef: { name: jwt-keys, key: public.pem }
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:  # the JVM and Flyway take a while; liveness starts after this passes
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36  # up to 3 minutes
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000  # Jib images run as 1000:1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
