# Who may connect to ops-dashboard. Everything else is refused by default-deny-ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ops-dashboard
  labels:
    app.kubernetes.io/name: ops-dashboard
    app.kubernetes.io/part-of: claims
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ops-dashboard
  policyTypes: [Ingress]
  ingress:
    # The ALB (target type ip) connects from the public subnets.
    - from:
        - ipBlock: { cidr: 10.20.200.0/24 }
        - ipBlock: { cidr: 10.20.201.0/24 }
      ports:
        - port: http
    # Prometheus (kube-prometheus-stack) scrapes /actuator/prometheus.
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
      ports:
        - port: http
