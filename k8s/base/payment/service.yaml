apiVersion: v1
kind: Service
metadata:
  name: payment
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: claims
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
      appProtocol: grpc
